name: Run Tests

on:
  push:
    branches:
      - main
      - "*.x"
  pull_request:

jobs:
  php-tests:
    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    strategy:
      matrix:
        php: [8.3, 8.4, 8.5]
        laravel: [12.*, 13.*]
        stability: [prefer-lowest, prefer-stable]
        os: [ubuntu-latest]
        include:
          - os: windows-latest
            php: 8.5
            laravel: 13.*
            stability: prefer-stable

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            config/**
            lang/**
            resources/views/**
            routes/**
            src/**
            tests/**
            composer.json
            phpunit.xml.dist
            .github/workflows/tests.yml
            **.php

      - name: Determine whether tests should run
        id: should-run-tests
        if: steps.changed-files.outputs.any_modified == 'true' || github.event_name == 'schedule'
        run: |
          echo "result=true" >> $GITHUB_OUTPUT
          echo "result=true" >> $env:GITHUB_OUTPUT

      - name: Update apt sources
        if: steps.should-run-tests.outputs.result == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get check || sudo apt --fix-broken install -y
          sudo apt-get update

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        if: steps.should-run-tests.outputs.result == 'true'
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, exif, gd, pdo, sqlite, pdo_sqlite
          ini-values: short_open_tag=on
          coverage: none
          # Pass an empty token so setup-php doesn't write GITHUB_TOKEN into
          # Composer's auth config. Composer 2.9.7's regex rejects the new
          # GITHUB_TOKEN format (composer/composer#12849).
          github-token: ""

      - name: Install dependencies
        uses: nick-invision/retry@v3
        if: steps.should-run-tests.outputs.result == 'true'
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: |
            composer require "illuminate/contracts:${{ matrix.laravel }}" --dev --no-interaction --no-update
            composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        if: steps.should-run-tests.outputs.result == 'true'
        run: composer show -D

      - name: Execute tests
        if: steps.should-run-tests.outputs.result == 'true'
        run: vendor/bin/phpunit
